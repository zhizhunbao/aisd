# Knowledge Map Generation Workflow State
# 此文件由 /generate-knowledge-map 命令自动管理

topic: ""
course: ""
started_at: ""
current_phase: 0
total_phases: 13

config:
  generate_video: false
  video_style: ""

phases:
  # 注意: 以下 checks 字段是 Agent 应手动执行的指令，不是自动化检查
  preflight:
    order: 0
    name: "Pre-Flight 检查"
    status: pending
    started_at: ""
    completed_at: ""
    output: ""
    step: "steps/step-00-preflight.md"
    references: "references/format_rules.md + steps/step-{阶段编号}-{阶段名}.md"
    checks:
      - read_file: ".agent/workflows/generate-knowledge-map/references/format_rules.md"
      - read_file: "根据 current_phase 读取对应 step 文件（如 step-02-map.md）"
      - confirm: "step 文件 = 唯一权威（教科书依据 + 模板 + 检查清单）"

  probe:
    order: 1
    name: "输入探测"
    status: pending
    started_at: ""
    completed_at: ""
    output: ""
    step: "steps/step-01-probe.md"
    role: "Source Researcher"
    skill: "learning-source-citation"
    depends_on: ["preflight"]
    checks:
      - sources_sufficient: true

  map:
    order: 2
    name: "Map 骨架"
    status: pending
    started_at: ""
    completed_at: ""
    output: "{topic}_map.md"
    role: "Navigator"
    step: "steps/step-02-map.md"
    depends_on: ["probe"]
    checks:
      - file_exists: "{topic}_map.md"
      - file_not_empty: "{topic}_map.md"

  concepts:
    order: 3
    name: "概念定义"
    status: pending
    started_at: ""
    completed_at: ""
    output: "{topic}_concepts.md"
    role: "Concept Builder"
    step: "steps/step-03-concepts.md"
    depends_on: ["map"]
    checks:
      - file_exists: "{topic}_concepts.md"

  math:
    order: 4
    name: "数学基础"
    status: pending
    started_at: ""
    completed_at: ""
    output: "{topic}_math.md"
    role: "Math Writer"
    step: "steps/step-04-math.md"
    depends_on: ["concepts"]
    skip_if: "no_math_content"
    checks:
      - file_exists: "{topic}_math.md"

  tutorial:
    order: 5
    name: "教程"
    status: pending
    started_at: ""
    completed_at: ""
    output: "{topic}_tutorial.md"
    role: "Tutorial Writer"
    step: "steps/step-05-tutorial.md"
    depends_on: ["math"]
    checks:
      - file_exists: "{topic}_tutorial.md"

  code:
    order: 6
    name: "代码参考"
    status: pending
    started_at: ""
    completed_at: ""
    output: "{topic}_code.md"
    role: "Code Engineer"
    step: "steps/step-06-code.md"
    depends_on: ["tutorial"]
    checks:
      - file_exists: "{topic}_code.md"

  pitfalls:
    order: 7
    name: "踩坑记录"
    status: pending
    started_at: ""
    completed_at: ""
    output: "{topic}_pitfalls.md"
    role: "Debug Expert"
    step: "steps/step-07-pitfalls.md"
    depends_on: ["code"]
    checks:
      - file_exists: "{topic}_pitfalls.md"

  history:
    order: 8
    name: "历史演进"
    status: pending
    started_at: ""
    completed_at: ""
    output: "{topic}_history.md"
    role: "Historian"
    step: "steps/step-08-history.md"
    depends_on: ["pitfalls"]
    skip_if: "too_new_or_no_history"
    checks:
      - file_exists: "{topic}_history.md"

  bridge:
    order: 9
    name: "跨主题衔接"
    status: pending
    started_at: ""
    completed_at: ""
    output: "{topic}_bridge.md"
    role: "Connector"
    step: "steps/step-09-bridge.md"
    depends_on: ["history"]
    skip_if: "completely_isolated"
    checks:
      - file_exists: "{topic}_bridge.md"

  first_principles:
    order: 10
    name: "第一性原理"
    status: pending
    started_at: ""
    completed_at: ""
    output: "{topic}_first_principles.md"
    role: "Philosopher"
    step: "steps/step-10-first-principles.md"
    depends_on: ["bridge"]
    skip_if: "pure_engineering_tool"
    checks:
      - file_exists: "{topic}_first_principles.md"

  finalize:
    order: 11
    name: "收尾"
    status: pending
    started_at: ""
    completed_at: ""
    output: "{topic}_map.md (updated)"
    step: "steps/step-11-finalize.md"
    role: "QA"
    depends_on: ["first_principles"]
    checks:
      - cross_references_valid: true

  video:
    order: 12
    name: "视频创作"
    status: pending
    started_at: ""
    completed_at: ""
    output: "script.json, narration/"
    step: "steps/step-12-video.md"
    role: "Video Director"
    skill: "ai-video-director"
    depends_on: ["finalize"]
    skip_unless: "config.generate_video == true"
    checks:
      - file_exists: "script.json"
