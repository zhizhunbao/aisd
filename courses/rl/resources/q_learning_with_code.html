out the updated version of this article at https:\u002F\u002Fomaraflak.com\u002Farticles\u002Fq-learning","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":57,"end":98,"href":"https:\u002F\u002Fomaraflak.com\u002Farticles\u002Fq-learning","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":98,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_4":{"__typename":"Paragraph","id":"7c1c5f292947_4","name":"1339","type":"H3","href":null,"layout":null,"metadata":null,"text":"Q-Learning","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_5":{"__typename":"Paragraph","id":"7c1c5f292947_5","name":"0664","type":"P","href":null,"layout":null,"metadata":null,"text":"Q-Learning is a type of Reinforcement Learning which is a type of Machine Learning. Reinforcement learning has been used lately to teach AIs to play games (Google DeepMind Atari, etc). Our goal is to understand a simple version of reinforcement learning called Q-Learning, and write a program that will learn how to play a simple game. Let’s dive in!","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":24,"end":46,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":10,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":24,"end":46,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":66,"end":82,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_6":{"__typename":"Paragraph","id":"7c1c5f292947_6","name":"876e","type":"H3","href":null,"layout":null,"metadata":null,"text":"High-level overview","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_7":{"__typename":"Paragraph","id":"7c1c5f292947_7","name":"32a5","type":"P","href":null,"layout":null,"metadata":null,"text":"In Q-Learning, we call the program trying to solve the problem the agent. The agent is going to navigate an environment, that is the problem being solved. The environment is modeled mathematically by a Markov Decision Process, which is a graph where each node is a state the agent may be in (think state in a game, e.g. position of the user, coins collected, etc.), and where the edges between those nodes are actions the agent can take to transition from one state to another (think commands in a game, e.g. right, left, jump, run, etc.). The goal of Q-Learning is to learn a so called Q-function, which tells the agent what action to take in a given state in order to maximize a reward function that we will define.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":67,"end":72,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":108,"end":119,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":265,"end":270,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":410,"end":417,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":587,"end":597,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":681,"end":688,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":696,"end":697,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":67,"end":72,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":108,"end":119,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":202,"end":225,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":265,"end":270,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":410,"end":417,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":587,"end":597,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":681,"end":688,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":696,"end":697,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_8":{"__typename":"Paragraph","id":"7c1c5f292947_8","name":"9902","type":"H3","href":null,"layout":null,"metadata":null,"text":"Markov Chain","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_9":{"__typename":"Paragraph","id":"7c1c5f292947_9","name":"75ba","type":"P","href":null,"layout":null,"metadata":null,"text":"A Markov chain is a mathematical model that experiences transition of states with probabilistic rules.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"ImageMetadata:1*xfK_RdBZOkE4buKDPDZdKg.png":{"__typename":"ImageMetadata","id":"1*xfK_RdBZOkE4buKDPDZdKg.png","originalHeight":220,"originalWidth":220,"focusPercentX":null,"focusPercentY":null,"alt":null},"Paragraph:7c1c5f292947_10":{"__typename":"Paragraph","id":"7c1c5f292947_10","name":"4435","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__ref":"ImageMetadata:1*xfK_RdBZOkE4buKDPDZdKg.png"},"text":"Markov chain — Wikipedia","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_11":{"__typename":"Paragraph","id":"7c1c5f292947_11","name":"900e","type":"P","href":null,"layout":null,"metadata":null,"text":"Here we have two states E and A, and the probabilities of going from one state to another, e.g. there is 70% chance of going to state A starting from state E. In this model, you start from a node of the graph, and simply experience the transition probabilities.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":24,"end":25,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":30,"end":31,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_12":{"__typename":"Paragraph","id":"7c1c5f292947_12","name":"95dd","type":"H3","href":null,"layout":null,"metadata":null,"text":"Markov Decision Process","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_13":{"__typename":"Paragraph","id":"7c1c5f292947_13","name":"a371","type":"P","href":null,"layout":null,"metadata":null,"text":"A Markov Decision Process (MDP) is an extension of the Markov chain and it is used to model more complex environments. In this extension, we add the possibility to make a choice at every state which is called an action. We also add a reward which is a feedback from the environment for going from one state to another through an action.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":212,"end":218,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":234,"end":240,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"ImageMetadata:1*eevLRhyeokWPDFu1e7iuMQ.png":{"__typename":"ImageMetadata","id":"1*eevLRhyeokWPDFu1e7iuMQ.png","originalHeight":424,"originalWidth":952,"focusPercentX":null,"focusPercentY":null,"alt":null},"Paragraph:7c1c5f292947_14":{"__typename":"Paragraph","id":"7c1c5f292947_14","name":"9bdd","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__ref":"ImageMetadata:1*eevLRhyeokWPDFu1e7iuMQ.png"},"text":"Image by Author","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_15":{"__typename":"Paragraph","id":"7c1c5f292947_15","name":"3526","type":"P","href":null,"layout":null,"metadata":null,"text":"In the image above, we are in the initial state don’t understand, where we have two possible actions, study and don’t study. For the study action, we may end up in different states according to a probabilistic rule. This is what we call a stochastic environment (random), in the sense that for one same action taken in the same state, we might have different results (understand and don’t understand).","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":48,"end":64,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":102,"end":107,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":112,"end":123,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":239,"end":249,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":368,"end":378,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":383,"end":399,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":48,"end":65,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":102,"end":107,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":112,"end":123,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":133,"end":139,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":368,"end":378,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":383,"end":399,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_16":{"__typename":"Paragraph","id":"7c1c5f292947_16","name":"44db","type":"P","href":null,"layout":null,"metadata":null,"text":"In reinforcement learning, this is how we model a game or environment, and our goal will be to maximize the reward we get from that environment.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":108,"end":115,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":144,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_17":{"__typename":"Paragraph","id":"7c1c5f292947_17","name":"e390","type":"H3","href":null,"layout":null,"metadata":null,"text":"Reward","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_18":{"__typename":"Paragraph","id":"7c1c5f292947_18","name":"77f2","type":"P","href":null,"layout":null,"metadata":null,"text":"The reward is the feedback from the environment that tells us how good we are doing. It can be the number of coins you grab in a game for example. Our goal is to maximize the total reward.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"EM","start":62,"end":70,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"ImageMetadata:0*lXszd8hM87XmeQLg.png":{"__typename":"ImageMetadata","id":"0*lXszd8hM87XmeQLg.png","originalHeight":38,"originalWidth":511,"focusPercentX":null,"focusPercentY":null,"alt":null},"Paragraph:7c1c5f292947_19":{"__typename":"Paragraph","id":"7c1c5f292947_19","name":"c244","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__ref":"ImageMetadata:0*lXszd8hM87XmeQLg.png"},"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_20":{"__typename":"Paragraph","id":"7c1c5f292947_20","name":"cf1b","type":"P","href":null,"layout":null,"metadata":null,"text":"We write Rt to denote the total reward we can get starting at some point t in time, as the sum of all the subsequent rewards earned at each time step.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":9,"end":11,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":73,"end":75,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":9,"end":11,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":73,"end":75,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_21":{"__typename":"Paragraph","id":"7c1c5f292947_21","name":"146c","type":"P","href":null,"layout":null,"metadata":null,"text":"For example, if we use the MDP presented above. We’re initially in the state don’t understand, we take the study action which takes us randomly to don’t understand. Therefore we experienced the reward r(t+1)=-1. Now we can decide to take another action which will give r(t+2) and so on. The total reward is the sum of all the immediate rewards we get for taking actions in the environment.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":77,"end":93,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":107,"end":112,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":147,"end":163,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":77,"end":95,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":106,"end":113,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":146,"end":163,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_22":{"__typename":"Paragraph","id":"7c1c5f292947_22","name":"8c44","type":"P","href":null,"layout":null,"metadata":null,"text":"Defining the reward this way leads to two major problems :","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_23":{"__typename":"Paragraph","id":"7c1c5f292947_23","name":"836f","type":"ULI","href":null,"layout":null,"metadata":null,"text":"This sum can potentially go to infinity, which is problematic since we want to maximize it.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_24":{"__typename":"Paragraph","id":"7c1c5f292947_24","name":"3117","type":"ULI","href":null,"layout":null,"metadata":null,"text":"We are accounting as much for future rewards as we do for immediate rewards.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_25":{"__typename":"Paragraph","id":"7c1c5f292947_25","name":"302b","type":"P","href":null,"layout":null,"metadata":null,"text":"One way to fix up these problems is to use a decreasing factor for future rewards.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"ImageMetadata:0*mflzCazg40-MvyTu.png":{"__typename":"ImageMetadata","id":"0*mflzCazg40-MvyTu.png","originalHeight":46,"originalWidth":577,"focusPercentX":null,"focusPercentY":null,"alt":null},"Paragraph:7c1c5f292947_26":{"__typename":"Paragraph","id":"7c1c5f292947_26","name":"2214","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__ref":"ImageMetadata:0*mflzCazg40-MvyTu.png"},"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_27":{"__typename":"Paragraph","id":"7c1c5f292947_27","name":"6f29","type":"P","href":null,"layout":null,"metadata":null,"text":"Setting γ=1 takes us back to the first expression where every reward is equally important. Setting γ=0 results in only looking for the immediate reward (always acting for the optimal next step). Setting γ between 0 and 1 is a compromise to look more for immediate reward but still account for future rewards.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":8,"end":12,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":99,"end":103,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":203,"end":205,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":212,"end":215,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":218,"end":221,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_28":{"__typename":"Paragraph","id":"7c1c5f292947_28","name":"5611","type":"P","href":null,"layout":null,"metadata":null,"text":"We can rewrite that expression in a recursive manner, that will come handy later on.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"ImageMetadata:0*SLvOh8O40AgFlUFf.png":{"__typename":"ImageMetadata","id":"0*SLvOh8O40AgFlUFf.png","originalHeight":171,"originalWidth":590,"focusPercentX":null,"focusPercentY":null,"alt":null},"Paragraph:7c1c5f292947_29":{"__typename":"Paragraph","id":"7c1c5f292947_29","name":"611b","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__ref":"ImageMetadata:0*SLvOh8O40AgFlUFf.png"},"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_30":{"__typename":"Paragraph","id":"7c1c5f292947_30","name":"b68d","type":"H3","href":null,"layout":null,"metadata":null,"text":"Policy","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_31":{"__typename":"Paragraph","id":"7c1c5f292947_31","name":"8851","type":"P","href":null,"layout":null,"metadata":null,"text":"A policy is a function that tells what action to take in a certain state. This function is usually denoted π(s,a) and yields the probability of taking action a in state s. We want to find the policy that maximizes the reward function.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":107,"end":113,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"M ll,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":33,"end":46,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"ImageMetadata:0*rQ7hXKOPSxcR271w.gif":{"__typename":"ImageMetadata","id":"0*rQ7hXKOPSxcR271w.gif","originalHeight":180,"originalWidth":300,"focusPercentX":null,"focusPercentY":null,"alt":null},"Paragraph:7c1c5f292947_67":{"__typename":"Paragraph","id":"7c1c5f292947_67","name":"1e1e","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__ref":"ImageMetadata:0*rQ7hXKOPSxcR271w.gif"},"text":"Greedy Algorithm — Wikipedia","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_68":{"__typename":"Paragraph","id":"7c1c5f292947_68","name":"db54","type":"P","href":null,"layout":null,"metadata":null,"text":"In a greedy policy context, we can write a relation between the state value and the action value functions.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":5,"end":26,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"ImageMetadata:0*1uaMoqlk7RTkWKba.png":{"__typename":"ImageMetadata","id":"0*1uaMoqlk7RTkWKba.png","originalHeight":57,"originalWidth":380,"focusPercentX":null,"focusPercentY":null,"alt":null},"Paragraph:7c1c5f292947_69":{"__typename":"Paragraph","id":"7c1c5f292947_69","name":"3369","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__ref":"ImageMetadata:0*1uaMoqlk7RTkWKba.png"},"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_70":{"__typename":"Paragraph","id":"7c1c5f292947_70","name":"12ad","type":"P","href":null,"layout":null,"metadata":null,"text":"Therefore, plugging this into the previous equation, we get the Q-Value of a (state, action) pair in a deterministic environment, following a greedy policy.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"ImageMetadata:0*Oy_aMmqo0ghQRA56.png":{"__typename":"ImageMetadata","id":"0*Oy_aMmqo0ghQRA56.png","originalHeight":64,"originalWidth":756,"focusPercentX":null,"focusPercentY":null,"alt":null},"Paragraph:7c1c5f292947_71":{"__typename":"Paragraph","id":"7c1c5f292947_71","name":"d0ae","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__ref":"ImageMetadata:0*Oy_aMmqo0ghQRA56.png"},"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_72":{"__typename":"Paragraph","id":"7c1c5f292947_72","name":"5aa8","type":"P","href":null,"layout":null,"metadata":null,"text":"Or simply,","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"ImageMetadata:0*Chz7J204az5VkjBi.png":{"__typename":"ImageMetadata","id":"0*Chz7J204az5VkjBi.png","originalHeight":61,"originalWidth":515,"focusPercentX":null,"focusPercentY":null,"alt":null},"Paragraph:7c1c5f292947_73":{"__typename":"Paragraph","id":"7c1c5f292947_73","name":"7b44","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__ref":"ImageMetadata:0*Chz7J204az5VkjBi.png"},"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_74":{"__typename":"Paragraph","id":"7c1c5f292947_74","name":"36ed","type":"P","href":null,"layout":null,"metadata":null,"text":"And this is the Bellman equation in the Q-Learning context ! It says that the value of an action a in some state s is the immediate reward you get for taking that action, plus the maximum expected future rewards you can get in the next state.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":16," ll,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":{"__typename":"Iframe","mediaResource":{"__ref":"MediaResource:e2145383b4b378cb415b65911369ba1b"}},"mixtapeMetadata":null},"Paragraph:7c1c5f292947_86":{"__typename":"Paragraph","id":"7c1c5f292947_86","name":"2162","type":"P","href":null,"layout":null,"metadata":null,"text":"The code is well commented and it is simply what we just discussed. Now the interesting part, the Q-Learning algorithm !","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"MediaResource:0dc3feb7d77a497a3a1cc754f3f1a7dc":{"__typename":"MediaResource","id":"0dc3feb7d77a497a3a1cc754f3f1a7dc","iframeSrc":"","iframeHeight":0,"iframeWidth":0,"title":"medium_qlearning_rl.py"},"Paragraph:7c1c5f292947_87":{"__typename":"Paragraph","id":"7c1c5f292947_87","name":"ab9e","type":"IFRAME","href":null,"layout":"INSET_CENTER","metadata":null,"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":{"__typename":"Iframe","mediaResource":{"__ref":"MediaResource:0dc3feb7d77a497a3a1cc754f3f1a7dc"}},"mixtapeMetadata":null},"Paragraph:7c1c5f292947_88":{"__typename":"Paragraph","id":"7c1c5f292947_88","name":"d334","type":"P","href":null,"layout":null,"metadata":null,"text":"I almost commented every single line of this code, so hopefully, it will be easy to understand!","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_89":{"__typename":"Paragraph","id":"7c1c5f292947_89","name":"5a26","type":"H4","href":null,"layout":null,"metadata":null,"text":"Run the code","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_90":{"__typename":"Paragraph","id":"7c1c5f292947_90","name":"032d","type":"P","href":null,"layout":null,"metadata":null,"text":"Put both of the above files in the same directory, and run :","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_91":{"__typename":"Paragraph","id":"7c1c5f292947_91","name":"322c","type":"PRE","href":null,"layout":null,"metadata":null,"text":"python3 medium_qlearning_rl.py","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_92":{"__typename":"Paragraph","id":"7c1c5f292947_92","name":"a38c","type":"P","href":null,"layout":null,"metadata":null,"text":"Around the epoch number 40, the agent should have learned to get to the treasure using one of the shortest paths (8 steps).","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":23,"end":26,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":23,"end":26,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_93":{"__typename":"Paragraph","id":"7c1c5f292947_93","name":"52fe","type":"H3","href":null,"layout":null,"metadata":null,"text":"Conclusion","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_94":{"__typename":"Paragraph","id":"7c1c5f292947_94","name":"5681","type":"P","href":null,"layout":null,"metadata":null,"text":"We have seen how to derive statistical formulas to find the Bellman equation and used it to teach an AI how to play a simple game. Notice that in this game, the number of possible states is finite (the number of different cells you might end up in), which is why building a Q-Table (a table of values that approaches the real value of the Q function for discrete values) is still manageable. What about a graphical game, such as Flappy Bird, Mario Bros, or Call Of Duty ? Every frame displayed by the game can be considered as a different state. In that case it’s impossible to build a Q-Table, and what we do instead is use a neural network who’s goal will be to learn the Q function. That neural network will typically take as input the current state of the game, and output the best possible action to take in that state. This is known as Deep Q Learning and is exactly how AIs such as Deep Blue or Alpha Go managed to beat world champions at Chess or Go.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":190,"end":197,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":842,"end":858,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:7c1c5f292947_95":{"__typename":"Paragraph","id":"7c1c5f292947_95","name":"ebd4","type":"H3","href":null,"layout":null,"metadata":null,"text":"I hope you enjoyed this article! Stay around for more! 😎","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"CollectionViewerEdge:collectionId:7f60cf5620c9-viewerId:lo_c2910edbb1bb":{"__typename":"CollectionViewerEdge","id":"collectionId:7f60cf5620c9-viewerId:lo_c2910edbb1bb","isEditor":false,"isMuting":false},"UserViewerEdge:userId:c215fdc67eb-viewerId:lo_c2910edbb1bb":{"__typename":"UserViewerEdge","id":"userId:c215fdc67eb-viewerId:lo_c2910edbb1bb","isMuting":false},"PostViewerEdge:postId:5dcbdc49b6f6-viewerId:lo_c2910edbb1bb":{"__typename":"PostViewerEdge","shouldIndexPostForExternalSearch":true,"id":"postId:5dcbdc49b6f6-viewerId:lo_c2910edbb1bb"},"Tag:machine-learning":{"__typename":"Tag","id":"machine-learning","displayTitle":"Machine Learning","normalizedTagSlug":"machine-learning"},"Tag:reinforcement-learning":{"__typename":"Tag","id":"reinforcement-learning","displayTitle":"Reinforcement Learning","normalizedTagSlug":"reinforcement-learning
