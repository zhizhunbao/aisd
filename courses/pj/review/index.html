<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GenAI Review Hub — Quizzes + Storylines</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0a0a16;color:#e0e0e0;min-height:100vh;line-height:1.6}

/* ===== MODE SWITCHER (top bar) ===== */
.mode-bar{display:flex;justify-content:center;gap:0;padding:0;background:#08081a;border-bottom:2px solid #7c5cbf44;position:sticky;top:0;z-index:300}
.mode-btn{flex:1;max-width:220px;padding:14px 0;text-align:center;font-size:.9rem;font-weight:700;cursor:pointer;border:none;background:transparent;color:#6b6b8a;transition:all .3s;position:relative;letter-spacing:.5px}
.mode-btn:hover{color:#a78bfa;background:#ffffff06}
.mode-btn.active{color:#fff;background:linear-gradient(180deg,#7c5cbf22 0%,transparent 100%)}
.mode-btn.active::after{content:'';position:absolute;bottom:0;left:20%;width:60%;height:3px;background:linear-gradient(90deg,#818cf8,#6ee7b7);border-radius:3px 3px 0 0}

/* ===== HERO ===== */
.hero{background:linear-gradient(135deg,#0d0d2b 0%,#1a0a3e 40%,#2d1b69 70%,#0d0d2b 100%);padding:42px 20px 32px;text-align:center;border-bottom:2px solid #7c5cbf44;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 50%,#818cf820 0%,transparent 50%);animation:heroGlow 8s ease-in-out infinite alternate}
@keyframes heroGlow{0%{transform:translate(0,0)}100%{transform:translate(5%,3%)}}
.hero h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#a78bfa 0%,#818cf8 40%,#6ee7b7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;position:relative;z-index:1}
.hero p{color:#a5a5c0;font-size:.85rem;position:relative;z-index:1}
#hero-title,#hero-sub{transition:opacity .3s}

/* ===== QUIZ STYLES ===== */
.toolbar{position:sticky;top:46px;z-index:200;background:#0d0d20ee;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid #ffffff10;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.score-box{font-size:.85rem;color:#a78bfa;font-weight:600;white-space:nowrap}
.progress-track{flex:1;min-width:100px;max-width:320px;height:6px;background:#ffffff10;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#818cf8,#6ee7b7);border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.toolbar-actions{display:flex;gap:8px;align-items:center}
.tb-btn{background:#ffffff0a;border:1px solid #ffffff18;color:#a5a5c0;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.78rem;transition:all .2s;white-space:nowrap}
.tb-btn:hover{background:#7c5cbf33;color:#fff;border-color:#7c5cbf66}
.tb-btn.active{background:#7c5cbf44;color:#a78bfa;border-color:#7c5cbf}
.week-nav{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;background:#0d0d20;border-bottom:1px solid #ffffff08;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.week-nav::-webkit-scrollbar{display:none}
.wn-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;background:#ffffff08;border:1px solid #ffffff12;color:#a5a5c0;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .25s;white-space:nowrap}
.wn-btn:hover{background:#7c5cbf22;border-color:#7c5cbf55;color:#c4c4d8}
.wn-btn.active{background:linear-gradient(135deg,#7c5cbf44,#818cf844);border-color:#818cf8;color:#fff}
.week-section{display:none;max-width:780px;margin:0 auto;padding:20px 16px 60px}
.week-section.visible{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.week-title{font-size:1.3rem;font-weight:700;color:#818cf8;margin-bottom:4px}
.week-subtitle{font-size:.85rem;color:#6b6b8a;margin-bottom:20px}
.q-card{background:#12122a;border:1px solid #ffffff0a;border-radius:14px;padding:20px;margin-bottom:14px;transition:border-color .3s,box-shadow .3s;position:relative}
.q-card:hover{border-color:#7c5cbf33;box-shadow:0 4px 20px #7c5cbf10}
.q-card.answered{opacity:.88}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.q-num{font-weight:700;font-size:.95rem;color:#818cf8}
.q-type{font-size:.65rem;padding:2px 8px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.badge-MCQ{background:#818cf822;color:#818cf8}
.badge-TF{background:#6ee7b722;color:#6ee7b7}
.badge-Fill{background:#fbbf2422;color:#fbbf24}
.badge-Short{background:#f472b622;color:#f472b6}
.q-source{font-size:.6rem;padding:2px 8px;border-radius:4px;font-weight:600;letter-spacing:.3px}
.source-teacher{background:#3b82f620;color:#60a5fa;border:1px solid #3b82f630}
.source-supplement{background:#f59e0b18;color:#fbbf24;border:1px solid #f59e0b30}
.source-predicted{background:#10b98118;color:#34d399;border:1px solid #10b98130}
.q-text{font-size:.92rem;line-height:1.65;margin-bottom:14px;color:#d4d4e0}
.q-text code{background:#ffffff10;padding:2px 6px;border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:.82rem;color:#f472b6}
.q-options{display:flex;flex-direction:column;gap:8px}
.opt-btn{background:#ffffff06;border:1px solid #ffffff12;color:#c4c4d8;padding:11px 16px;border-radius:10px;cursor:pointer;text-align:left;font-size:.86rem;transition:all .2s;line-height:1.45;-webkit-tap-highlight-color:transparent}
.opt-btn:hover:not(:disabled){background:#7c5cbf18;border-color:#7c5cbf55;color:#e8e8f0}
.opt-btn:active:not(:disabled){transform:scale(.98)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{background:#065f4618;border-color:#6ee7b7;color:#6ee7b7;font-weight:500}
.opt-btn.wrong{background:#7f1d1d18;border-color:#f87171;color:#f87171}
.q-fill{display:flex;gap:8px;align-items:center}
.fill-input{flex:1;background:#ffffff06;border:1px solid #ffffff18;color:#e0e0e0;padding:10px 14px;border-radius:10px;font-size:.86rem;outline:none;font-family:inherit}
.fill-input:focus{border-color:#818cf8;box-shadow:0 0 0 3px #818cf820}
.check-btn,.reveal-btn{background:linear-gradient(135deg,#7c5cbf,#818cf8);border:none;color:#fff;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:.82rem;font-weight:600;white-space:nowrap;transition:all .2s;-webkit-tap-highlight-color:transparent}
.check-btn:hover,.reveal-btn:hover{opacity:.85;transform:translateY(-1px)}
.check-btn:active,.reveal-btn:active{transform:scale(.96)}
.q-feedback{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1),padding .4s ease,opacity .4s ease;border-radius:10px;margin-top:0;opacity:0}
.q-feedback.show{max-height:800px;padding:14px 16px;margin-top:12px;opacity:1}
.q-feedback.right{background:#065f4615;border:1px solid #6ee7b733}
.q-feedback.wrong{background:#7f1d1d15;border:1px solid #f8717133}
.q-feedback.info{background:#1e1b4b40;border:1px solid #818cf833}
.fb-icon{font-size:1.1rem;margin-right:8px;vertical-align:middle}
.fb-text{display:inline;font-size:.82rem;line-height:1.75;color:#c4c4d8}
.fb-text strong{color:#a78bfa}
.fb-text code{background:#ffffff10;padding:1px 5px;border-radius:3px;font-family:'SF Mono',Consolas,monospace;font-size:.78rem;color:#f472b6}
.katex{color:#e0e0e0;font-size:1em}
.q-text .katex{font-size:.95em}
.fb-text .katex{font-size:.88em}
.opt-btn .katex{font-size:.88em}
.legend{max-width:780px;margin:20px auto 0;padding:0 16px}
.legend-box{display:flex;gap:16px;align-items:center;padding:12px 16px;background:#12122a;border:1px solid #ffffff0a;border-radius:10px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.75rem;color:#a5a5c0}
.legend-dot{width:10px;height:10px;border-radius:3px}
.dot-teacher{background:#3b82f6}
.dot-supplement{background:#f59e0b}

/* ===== STORYLINE STYLES ===== */
#storyline-view{display:none}
.story-nav{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;background:#0d0d20;border-bottom:1px solid #ffffff08;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:sticky;top:46px;z-index:200;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.story-nav::-webkit-scrollbar{display:none}
.story-content{max-width:820px;margin:0 auto;padding:24px 18px 80px;animation:fadeUp .4s ease}
.story-loading{text-align:center;padding:60px 20px;color:#6b6b8a;font-size:.9rem}
.story-loading .spinner{display:inline-block;width:28px;height:28px;border:3px solid #ffffff15;border-top-color:#818cf8;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== MARKDOWN RENDERED STYLES ===== */
.md-body{color:#d4d4e0;line-height:1.75;font-size:.92rem}
.md-body h1{font-size:1.5rem;font-weight:700;color:#a78bfa;margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid #7c5cbf33}
.md-body h2{font-size:1.25rem;font-weight:700;color:#818cf8;margin:24px 0 12px;padding-bottom:6px;border-bottom:1px solid #ffffff10}
.md-body h3{font-size:1.05rem;font-weight:600;color:#6ee7b7;margin:20px 0 10px}
.md-body h4{font-size:.95rem;font-weight:600;color:#fbbf24;margin:16px 0 8px}
.md-body p{margin:10px 0}
.md-body ul,.md-body ol{margin:10px 0;padding-left:24px}
.md-body li{margin:4px 0}
.md-body blockquote{border-left:4px solid #818cf8;background:#12122a;padding:12px 16px;margin:14px 0;border-radius:0 10px 10px 0;color:#c4c4d8}
.md-body blockquote strong{color:#a78bfa}
.md-body code{background:#ffffff10;padding:2px 6px;border-radius:4px;font-family:'SF Mono',Consolas,'Courier New',monospace;font-size:.82rem;color:#f472b6}
.md-body pre{background:#0d0d28;border:1px solid #ffffff0a;border-radius:10px;padding:16px;margin:14px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.md-body pre code{background:transparent;padding:0;color:#c4c4d8;font-size:.8rem;line-height:1.6}
.md-body table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.84rem;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
.md-body thead{background:#12122a}
.md-body th{padding:10px 12px;text-align:left;font-weight:600;color:#a78bfa;border-bottom:2px solid #7c5cbf33;white-space:nowrap}
.md-body td{padding:8px 12px;border-bottom:1px solid #ffffff08;vertical-align:top}
.md-body tr:hover{background:#ffffff04}
.md-body img{max-width:100%;border-radius:10px;margin:14px 0;border:1px solid #ffffff10}
.md-body hr{border:none;height:1px;background:linear-gradient(90deg,transparent,#7c5cbf44,transparent);margin:28px 0}
.md-body a{color:#818cf8;text-decoration:none;border-bottom:1px solid #818cf844}
.md-body a:hover{color:#a78bfa;border-bottom-color:#a78bfa}
.md-body strong{color:#e8e8f0}
.md-body em{color:#c4c4d8;font-style:italic}

/* ===== BACK TO TOP ===== */
.back-top{position:fixed;bottom:24px;right:20px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7c5cbf,#818cf8);border:none;color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 16px #7c5cbf44;z-index:500;display:none;align-items:center;justify-content:center;transition:all .3s;-webkit-tap-highlight-color:transparent}
.back-top:hover{transform:translateY(-2px);box-shadow:0 6px 24px #7c5cbf66}
.back-top.show{display:flex}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .hero{padding:28px 16px 22px}
  .hero h1{font-size:1.2rem}
  .q-card{padding:16px}
  .toolbar{padding:8px 12px;top:46px}
  .q-text{font-size:.88rem}
  .opt-btn{padding:12px 14px;font-size:.84rem}
  .md-body{font-size:.88rem}
  .md-body h1{font-size:1.3rem}
  .md-body h2{font-size:1.1rem}
  .md-body pre{padding:12px;font-size:.75rem}
  .md-body table{font-size:.78rem}
  .mode-btn{font-size:.8rem;padding:12px 0}
}
</style>
</head>
<body>

<!-- ===== MODE SWITCHER ===== -->
<div class="mode-bar">
  <button class="mode-btn active" id="mode-quiz" onclick="switchMode('quiz')">📝 刷题 Quiz</button>
  <button class="mode-btn" id="mode-story" onclick="switchMode('story')">📖 故事线 Storyline</button>
  <button class="mode-btn" id="mode-slides" onclick="switchMode('slides')">📊 Slides</button>
  <button class="mode-btn" id="mode-cheatsheet" onclick="switchMode('cheatsheet')">📄 速查表 Cheat Sheet</button>
</div>

<!-- ===== HERO ===== -->
<div class="hero">
  <h1 id="hero-title">GenAI Evaluation — Review Hub</h1>
  <p id="hero-sub">刷题 + 故事线阅读 · W1-W12 · 手机随时复习</p>
</div>

<!-- ===== QUIZ VIEW ===== -->
<div id="quiz-view">
  <div class="toolbar" id="toolbar">
    <div class="score-box">Score: <span id="score-display">0 / 0</span></div>
    <div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
    <div class="toolbar-actions">
      <button class="tb-btn" id="filter-all" onclick="setFilter('all')">All</button>
      <button class="tb-btn" id="filter-teacher" onclick="setFilter('teacher')">👨‍🏫 Teacher</button>
      <button class="tb-btn" id="filter-supplement" onclick="setFilter('supplement')">📝 Supp</button>
      <button class="tb-btn" id="filter-predicted" onclick="setFilter('predicted')">🎯 Pred</button>
      <button class="tb-btn" id="reset-btn">Reset</button>
    </div>
  </div>
  <div class="week-nav" id="week-nav"></div>
  <div class="legend">
    <div class="legend-box">
      <div class="legend-item"><div class="legend-dot dot-teacher"></div><span>👨‍🏫 Teacher</span></div>
      <div class="legend-item"><div class="legend-dot dot-supplement"></div><span>📝 Supplement</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div><span>🎯 Predicted</span></div>
    </div>
  </div>
  <div id="weeks-container"></div>
</div>

<!-- ===== STORYLINE VIEW ===== -->
<div id="storyline-view">
  <div class="story-nav" id="story-nav"></div>
  <div id="story-container">
    <div class="story-loading"><div class="spinner"></div><br>选择一个 Week 开始阅读</div>
  </div>
</div>

<!-- ===== SLIDES VIEW ===== -->
<div id="slides-view" style="display:none">
  <div class="story-nav" id="slides-nav"></div>
  <div id="slides-container">
    <div class="story-loading"><div class="spinner"></div><br>选择一个 Week 查看 Slides</div>
  </div>
</div>

<!-- ===== CHEAT SHEET VIEW ===== -->
<div id="cheatsheet-view" style="display:none">
  <div class="story-nav" id="cs-nav"></div>
  <div id="cs-container">
    <div class="story-loading"><div class="spinner"></div><br>选择一个 Week 查看速查表</div>
  </div>
</div>

<!-- ===== BACK TO TOP ===== -->
<button class="back-top" id="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<!-- Quiz data is loaded dynamically from JSON files -->

<!-- ===== MAIN LOGIC ===== -->
<script>
// ===================== MODE SWITCHING =====================
let currentMode = 'quiz';

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-' + mode).classList.add('active');

  document.getElementById('quiz-view').style.display = mode==='quiz' ? 'block' : 'none';
  document.getElementById('storyline-view').style.display = mode==='story' ? 'block' : 'none';
  document.getElementById('slides-view').style.display = mode==='slides' ? 'block' : 'none';
  document.getElementById('cheatsheet-view').style.display = mode==='cheatsheet' ? 'block' : 'none';

  const heroMap = {
    quiz:       ['GenAI Evaluation — All Quizzes (' + totalQ + ' Questions)', '全部测验合集 · W1-W12 + Final Prediction · 手机随时刷题'],
    story:      ['GenAI Evaluation — Storylines 📖', '故事线阅读 · 因果链路 · 手机随时看'],
    slides:     ['GenAI Evaluation — Slides 📊', '课件笔记 · 原始 Slide 结构化阅读'],
    cheatsheet: ['GenAI Evaluation — Cheat Sheets 📄', '速查表 · 定义/对比/公式/陷阱 · 考前速览'],
  };
  const [title, sub] = heroMap[mode] || heroMap.quiz;
  document.getElementById('hero-title').textContent = title;
  document.getElementById('hero-sub').textContent = sub;
  window.scrollTo({ top: 0 });
  // auto-load first week on first visit
  if (mode === 'story' && !currentStory) loadStory(STORYLINES[0].id);
  if (mode === 'slides' && !currentSlides) loadSlides(SLIDES[0].id);
  if (mode === 'cheatsheet' && !currentCS) loadCS(CHEATSHEETS[0].id);
}

// ===================== STORYLINE =====================
const STORYLINES = [
  { id: 'w1', label: 'W1 评估基础', file: '../notes/Week1_storyline.md' },
  { id: 'w2', label: 'W2 框架工具', file: '../notes/Week2_storyline.md' },
  { id: 'w3', label: 'W3 特征工程', file: '../notes/Week3_storyline.md' },
  { id: 'w4', label: 'W4 算法/分布式', file: '../notes/Week4_storyline.md' },
  { id: 'w6', label: 'W6 部署压缩', file: '../notes/Week6_storyline.md' },
  { id: 'w7', label: 'W7 MLOps', file: '../notes/Week7_storyline.md' },
  { id: 'w9', label: 'W9 基础设施', file: '../notes/Week9_storyline.md' },
  { id: 'w11', label: 'W11 RAG/Prompt', file: '../notes/Week11_storyline.md' },
  { id: 'w12', label: 'W12 微调/LoRA', file: '../notes/Week12_storyline.md' },
];

const SLIDES = [
  { id: 'w1',  label: 'W1 评估基础', file: '../notes/Week1_slides.md' },
  { id: 'w2',  label: 'W2 框架工具', file: '../notes/Week2_slides.md' },
  { id: 'w3',  label: 'W3 特征工程', file: '../notes/Week3_slides.md' },
  { id: 'w4',  label: 'W4 算法/分布式', file: '../notes/Week4_slides.md' },
  { id: 'w6',  label: 'W6 部署压缩', file: '../notes/Week6_slides.md' },
  { id: 'w7',  label: 'W7 MLOps', file: '../notes/Week7_slides.md' },
  { id: 'w9',  label: 'W9 基础设施', file: '../notes/Week9_slides.md' },
  { id: 'w11', label: 'W11 RAG/Prompt', file: '../notes/Week11_slides.md' },
  { id: 'w12', label: 'W12 微调/LoRA', file: '../notes/Week12_slides.md' },
];

const CHEATSHEETS = [
  { id: 'w1',   label: 'W1 评估基础', file: 'cheat_sheet_w1.md' },
  { id: 'w2',   label: 'W2 框架工具', file: 'cheat_sheet_w2.md' },
  { id: 'w3',   label: 'W3 特征工程', file: 'cheat_sheet_w3.md' },
  { id: 'w4',   label: 'W4 算法/分布式', file: 'cheat_sheet_w4.md' },
  { id: 'w6',   label: 'W6 部署压缩', file: 'cheat_sheet_w6.md' },
  { id: 'w7w9', label: 'W7/W9 MLOps', file: 'cheat_sheet_w7w9.md' },
  { id: 'w11',  label: 'W11 RAG/Prompt', file: 'cheat_sheet_w11.md' },
  { id: 'w12',  label: 'W12 微调/LoRA', file: 'cheat_sheet_w12.md' },
];

let storyCache = {};
let slidesCache = {};
let csCache = {};
let currentStory = null;
let currentSlides = null;
let currentCS = null;

function buildStoryNav() {
  const nav = document.getElementById('story-nav');
  nav.innerHTML = STORYLINES.map(s =>
    `<button class="wn-btn" data-story="${s.id}" onclick="loadStory('${s.id}')">${s.label}</button>`
  ).join('');
}

function buildSlidesNav() {
  const nav = document.getElementById('slides-nav');
  nav.innerHTML = SLIDES.map(s =>
    `<button class="wn-btn" data-slides="${s.id}" onclick="loadSlides('${s.id}')">${s.label}</button>`
  ).join('');
}

function buildCSNav() {
  const nav = document.getElementById('cs-nav');
  nav.innerHTML = CHEATSHEETS.map(c =>
    `<button class="wn-btn" data-cs="${c.id}" onclick="loadCS('${c.id}')">${c.label}</button>`
  ).join('');
}

async function loadStory(id) {
  document.querySelectorAll('#story-nav .wn-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`#story-nav [data-story="${id}"]`)?.classList.add('active');
  currentStory = id;
  const container = document.getElementById('story-container');
  if (storyCache[id]) { renderMd(storyCache[id], container, '../notes/'); return; }
  container.innerHTML = '<div class="story-loading"><div class="spinner"></div><br>加载中...</div>';
  const s = STORYLINES.find(x => x.id === id);
  try {
    const resp = await fetch(s.file);
    if (!resp.ok) throw new Error(resp.status);
    const md = await resp.text();
    storyCache[id] = md;
    renderMd(md, container, '../notes/');
  } catch (e) {
    container.innerHTML = `<div class="story-loading">❌ 加载失败: ${e.message}<br><small>${s.file}</small></div>`;
  }
}

function renderMd(md, container, imgBase) {
  const renderer = new marked.Renderer();
  renderer.image = function(href, title, text) {
    if (typeof href === 'object') { text = href.text; title = href.title; href = href.href; }
    if (href && !href.startsWith('http') && !href.startsWith('/') && !href.startsWith('../')) {
      href = imgBase + href;
    }
    const t = title ? ` title="${title}"` : '';
    const a = text ? ` alt="${text}"` : '';
    return `<img src="${href}"${a}${t} loading="lazy">`;
  };
  const html = marked.parse(md, { renderer, gfm: true, breaks: false });
  container.innerHTML = `<div class="story-content"><div class="md-body">${html}</div></div>`;
  window.scrollTo({ top: 0 });
  setTimeout(renderMath, 100);
}

// ===================== QUIZ LOGIC =====================
const QUIZ_FILES = [
  { id: 'w1',    title: 'Week 1 — GenAI Evaluation Fundamentals',       subtitle: 'LLM-as-Judge, BLEU, METEOR, BERTScore, Bias Types',                     file: 'quizzes/week01_quiz.json' },
  { id: 'w2',    title: 'Week 2 — Evaluation Frameworks & Observability', subtitle: 'RAGAS, DeepEval, OpenTelemetry, Faithfulness, G-Eval',                  file: 'quizzes/week02_quiz.json' },
  { id: 'w3',    title: 'Week 3 — Feature Engineering & Data Quality',    subtitle: 'Missing Data, One-Hot, SHAP, Data Leakage, Imbalanced Data',           file: 'quizzes/week03_quiz.json' },
  { id: 'w4',    title: 'Week 4 — Algorithm Selection & Distributed',     subtitle: 'Parallelism, NAS, HPO, Gradient Boosting, DDP/FSDP',                    file: 'quizzes/week04_quiz.json' },
  { id: 'w6',    title: 'Week 6 — Deployment & Model Compression',        subtitle: 'Quantization, Pruning, Knowledge Distillation, Scaling',                file: 'quizzes/week06_quiz.json' },
  { id: 'w7',    title: 'Week 7 — MLOps & Infrastructure',                subtitle: 'Docker, Kubernetes, Airflow, Feature Store, DAG',                       file: 'quizzes/week07_quiz.json' },
  { id: 'w11',   title: 'Week 11 — Advanced RAG & Prompt Optimization',   subtitle: 'Chunking, Hybrid Retrieval, OPRO, Self-Consistency, Reflexion',         file: 'quizzes/week11_quiz.json' },
  { id: 'w12',   title: 'Week 12 — Fine-Tuning & LoRA',                   subtitle: 'LoRA, Full Fine-Tuning, Catastrophic Forgetting, LlamaFactory',         file: 'quizzes/week12_quiz.json' },
  { id: 'final', title: 'Final Exam — Predicted Short Answer',            subtitle: 'Comprehensive short-answer questions covering all weeks',               file: 'quizzes/final_short_answer.json' },
];

let ALL_WEEKS = [];
let score=0,totalQ=0,answeredQ=0,currentWeek='all',currentFilter='all';

async function loadAllQuizzes() {
  const results = await Promise.all(QUIZ_FILES.map(async (wk) => {
    try {
      const resp = await fetch(wk.file);
      if (!resp.ok) throw new Error(resp.status);
      const data = await resp.json();
      return { id: wk.id, title: wk.title, subtitle: wk.subtitle, data };
    } catch (e) {
      console.warn(`Failed to load ${wk.file}:`, e);
      return null;
    }
  }));
  ALL_WEEKS = results.filter(Boolean);
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadAllQuizzes();
  buildNav(); renderAll(); setActiveWeek('all'); setFilter('all');
  buildStoryNav();
  buildSlidesNav();
  buildCSNav();
  document.getElementById('reset-btn').addEventListener('click', resetAll);
});

function buildNav(){
  const nav=document.getElementById('week-nav');
  let html='<button class="wn-btn active" onclick="setActiveWeek(\'all\')">📚 All</button>';
  ALL_WEEKS.forEach(w=>{
    const label=w.id.toUpperCase();
    html+=`<button class="wn-btn" onclick="setActiveWeek('${w.id}')">${label}</button>`;
  });
  nav.innerHTML=html;
}

function renderAll(){
  const container=document.getElementById('weeks-container');
  container.innerHTML='';score=0;answeredQ=0;totalQ=0;
  ALL_WEEKS.forEach(week=>{
    const section=document.createElement('div');
    section.className='week-section';section.id='section-'+week.id;section.dataset.weekId=week.id;
    let html=`<h2 class="week-title">${week.title}</h2><p class="week-subtitle">${week.subtitle}</p>`;
    const filteredData=getFilteredData(week.data);
    filteredData.forEach((q,idx)=>{const gid=week.id+'-'+idx;html+=buildCard(q,idx,gid);});
    section.innerHTML=html;container.appendChild(section);totalQ+=filteredData.length;
  });
  updateScore();showActiveWeek();renderMath();
}

function getFilteredData(data){
  if(currentFilter==='all')return data;
  return data.filter(q=>(q.source||'teacher')===currentFilter);
}

function buildCard(q,idx,gid){
  const src=q.source||'teacher';
  const srcLabels={teacher:'👨‍🏫 Teacher',supplement:'📝 Supplement',predicted:'🎯 Predicted'};
  const srcClasses={teacher:'source-teacher',supplement:'source-supplement',predicted:'source-predicted'};
  let h=`<div class="q-card" id="card-${gid}"><div class="q-header">`;
  h+=`<span class="q-num">Q${idx+1}</span><span class="q-type badge-${q.type}">${q.type}</span>`;
  h+=`<span class="q-source ${srcClasses[src]||srcClasses.teacher}">${srcLabels[src]||srcLabels.teacher}</span>`;
  if(q.points)h+=`<span class="q-source source-predicted" style="margin-left:4px">${q.points} pts</span>`;
  h+=`</div><p class="q-text">${q.question}</p>`;
  if(q.type==='MCQ'||q.type==='TF'){
    const opts=q.type==='TF'?['True','False']:q.options;
    h+='<div class="q-options">';
    opts.forEach((opt,oi)=>{h+=`<button class="opt-btn" onclick="checkOpt('${gid}',${oi},this)">${opt}</button>`;});
    h+='</div>';
  }else if(q.type==='Fill'){
    h+=`<div class="q-fill"><input type="text" class="fill-input" id="fi-${gid}" placeholder="输入答案…"><button class="check-btn" onclick="checkFill('${gid}')">Check ✓</button></div>`;
  }else if(q.type==='Short'){
    h+=`<div class="q-short"><button class="reveal-btn" onclick="revealShort('${gid}',this)">Show Answer 👁</button></div>`;
  }
  h+=`<div class="q-feedback" id="fb-${gid}"></div></div>`;return h;
}

function getQuizByGid(gid){
  const[wid,idx]=gid.split('-');
  return getFilteredData(ALL_WEEKS.find(w=>w.id===wid).data)[parseInt(idx)];
}

window.checkOpt=function(gid,oi,btn){
  const card=document.getElementById('card-'+gid);
  if(card.classList.contains('answered'))return;
  card.classList.add('answered');answeredQ++;
  const q=getQuizByGid(gid),correct=q.answer;
  const isCorrect=(q.type==='TF')?(['True','False'][oi]===correct):(oi===correct);
  card.querySelectorAll('.opt-btn').forEach((b,i)=>{
    b.disabled=true;
    if(q.type==='TF'){if(['True','False'][i]===correct)b.classList.add('correct');else if(i===oi)b.classList.add('wrong');}
    else{if(i===correct)b.classList.add('correct');else if(i===oi)b.classList.add('wrong');}
  });
  if(isCorrect)score++;updateScore();showFeedback(gid,isCorrect,q.explanation);
};

window.checkFill=function(gid){
  const card=document.getElementById('card-'+gid);
  if(card.classList.contains('answered'))return;
  card.classList.add('answered');answeredQ++;
  const q=getQuizByGid(gid),input=document.getElementById('fi-'+gid).value.trim().toLowerCase();
  const answers=Array.isArray(q.answer)?q.answer:[q.answer];
  const isCorrect=answers.some(a=>input===String(a).toLowerCase());
  if(isCorrect)score++;updateScore();
  showFeedback(gid,isCorrect,`<strong>正确答案:</strong> ${answers.join(' / ')}<br>${q.explanation}`);
};

window.revealShort=function(gid,btn){
  const card=document.getElementById('card-'+gid);
  if(card.classList.contains('answered'))return;
  card.classList.add('answered');answeredQ++;btn.style.display='none';
  const q=getQuizByGid(gid);
  showFeedback(gid,null,`<strong>Answer:</strong> ${q.answer}<br>${q.explanation}`);
};

function showFeedback(gid,isCorrect,explanation){
  const fb=document.getElementById('fb-'+gid);
  fb.className='q-feedback show '+(isCorrect===null?'info':isCorrect?'right':'wrong');
  fb.innerHTML=`<span class="fb-icon">${isCorrect===null?'📖':isCorrect?'✅':'❌'}</span><div class="fb-text">${explanation}</div>`;
  renderMath();
}

function updateScore(){
  const el=document.getElementById('score-display');
  if(el)el.textContent=`${score} / ${totalQ}  (${answeredQ} answered)`;
  const bar=document.getElementById('progress-bar');
  if(bar)bar.style.width=(totalQ?(answeredQ/totalQ*100):0)+'%';
}

function setActiveWeek(weekId){
  currentWeek=weekId;showActiveWeek();
  document.querySelectorAll('#week-nav .wn-btn').forEach(b=>b.classList.remove('active'));
  if(weekId==='all')document.querySelector('#week-nav .wn-btn').classList.add('active');
  else{const idx=ALL_WEEKS.findIndex(w=>w.id===weekId)+1;document.querySelectorAll('#week-nav .wn-btn')[idx]?.classList.add('active');}
}

function showActiveWeek(){
  document.querySelectorAll('.week-section').forEach(s=>{
    if(currentWeek==='all'||s.dataset.weekId===currentWeek)s.classList.add('visible');
    else s.classList.remove('visible');
  });
}

function setFilter(filter){
  currentFilter=filter;
  document.querySelectorAll('.toolbar-actions .tb-btn:not(#reset-btn)').forEach(b=>b.classList.remove('active'));
  document.getElementById('filter-'+filter)?.classList.add('active');
  renderAll();
}

function resetAll(){renderAll();window.scrollTo({top:0,behavior:'smooth'});}

function renderMath(){
  if(typeof renderMathInElement==='undefined')return;
  renderMathInElement(document.body,{
    delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],
    throwOnError:false,trust:true
  });
}
window.addEventListener('load',renderMath);

// ===================== BACK TO TOP =====================
window.addEventListener('scroll', () => {
  const btn = document.getElementById('back-top');
  if (window.scrollY > 400) btn.classList.add('show');
  else btn.classList.remove('show');
});
</script>
