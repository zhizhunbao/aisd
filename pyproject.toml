[project]
name = "aisd"
version = "0.1.0"
description = "AI & Software Development Learning Environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core scientific computing
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.3.0",
    # Machine Learning (ml)
    "scipy>=1.11.0",
    "seaborn>=0.12.0",
    # Machine Vision (mv)
    "opencv-python>=4.12.0.88",
    # NLP
    "nltk>=3.9.1",
    "gensim>=4.3.0",
    # RL (Reinforcement Learning)
    "gymnasium>=0.29.0",
    # Web scraping
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    # PDF processing
    "pdfplumber>=0.11.0",
    "pypdf>=6.6.0",
    "pymupdf>=1.26.7",
    "pytesseract>=0.3.13",
    "pillow>=12.1.0",
    "pdf2image>=1.17.0",
    "pix2text>=1.1.4",
    "python-docx>=1.2.0",
    "mammoth>=1.11.0",
    "pygments>=2.19.2",
    "comtypes>=1.4.15",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "jupytext>=1.19.0",
    "pypandoc>=1.16.2",
    "python-dotenv>=1.2.1",
    "tabulate>=0.9.0",
    "tensorflow>=2.20.0",
    "python-pptx>=1.0.2",
    "statsmodels>=0.14.6",
    "sentence-transformers>=5.2.3",
    "rank-bm25>=0.2.2",
    "fasttext-wheel>=0.9.2",
    "stable-baselines3>=2.7.1",
    # PDF → Markdown (MinerU)
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "mineru[pipeline]",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
    "jupytext>=1.19.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts", "courses"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Force opencv-python-headless to resolve as opencv-python (with GUI support)
# albumentations/albucore depend on headless, but we need imshow for MV labs
override-dependencies = [
    "opencv-python-headless>=4.12.0.88 ; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
